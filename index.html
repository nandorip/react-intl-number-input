<!DOCTYPE html>
<html lang="en">
<head>
    <title>React Intl Number Input — Demo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive demo of react-intl-number-input">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text: #1a1f36;
            --muted: #5c6370;
            --border: #e2e8f0;
            --accent: #3b5bdb;
            --accent-soft: #edf2ff;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1419;
                --surface: #1a2332;
                --text: #e8edf5;
                --muted: #9aa5b5;
                --border: #2d3a4d;
                --accent: #748ffc;
                --accent-soft: #1e2a44;
                --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .demo {
            max-width: 960px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 3rem;
        }

        .demo-header {
            margin-bottom: 2rem;
        }

        .demo-header h1 {
            margin: 0 0 0.5rem;
            font-size: 1.75rem;
            letter-spacing: -0.02em;
        }

        .demo-header p {
            margin: 0;
            color: var(--muted);
            max-width: 52ch;
        }

        .demo-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .demo-links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .demo-links a:hover {
            text-decoration: underline;
        }

        .demo-tip {
            margin: 1.5rem 0 2rem;
            padding: 0.9rem 1rem;
            background: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        .demo-tip strong {
            color: var(--text);
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .demo-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.15rem 1.2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .demo-card h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .demo-card p {
            margin: 0;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .demo-card .demo-input {
            width: 100%;
            max-width: 100%;
            padding: 0.55rem 0.7rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
        }

        .demo-card .demo-input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .demo-card .demo-input:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .demo-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .demo-controls button {
            padding: 0.35rem 0.65rem;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
        }

        .demo-controls button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .demo-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .demo-controls span {
            flex: 1;
            font-size: 0.88rem;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .demo-output {
            margin-top: auto;
            padding-top: 0.65rem;
            border-top: 1px dashed var(--border);
            font-size: 0.82rem;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .demo-output span {
            display: block;
            margin-top: 0.15rem;
            color: var(--text);
            word-break: break-all;
        }

        .demo-footer {
            margin-top: 2.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
            text-align: center;
        }

        .demo-footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .demo-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this demo.</noscript>
    <div id="root"></div>
    <script src="./bundle.js"></script>
</body>
</html>
