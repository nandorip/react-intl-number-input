<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Intl Number Input Demo | Locale-Aware React Component</title>
    <meta name="description" content="Try a React number input with locale-aware formatting, configurable precision, prefixes, suffixes, and value limits. See examples and install the package.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta name="theme-color" content="#22242a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
    <link rel="canonical" href="https://nandorip.github.io/react-intl-number-input/">
    <link rel="sitemap" type="application/xml" href="https://nandorip.github.io/react-intl-number-input/sitemap.xml">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="React Intl Number Input">
    <meta property="og:title" content="React Intl Number Input Demo">
    <meta property="og:description" content="An interactive demo of locale-aware number formatting, precision, prefixes, suffixes, and bounds in React.">
    <meta property="og:url" content="https://nandorip.github.io/react-intl-number-input/">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="React Intl Number Input Demo">
    <meta name="twitter:description" content="Try locale-aware number formatting and masked numeric inputs in React.">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareSourceCode",
            "name": "react-intl-number-input",
            "description": "A React component for masked and formatted number input with Intl.NumberFormat locale support.",
            "url": "https://nandorip.github.io/react-intl-number-input/",
            "codeRepository": "https://github.com/nandorip/react-intl-number-input",
            "programmingLanguage": "TypeScript",
            "runtimePlatform": "React",
            "version": "0.9.1",
            "license": "https://opensource.org/license/mit"
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
            --background: oklch(16% 0.01 250);
            --foreground: oklch(95% 0.01 90);
            --card: oklch(20% 0.012 250);
            --primary: oklch(86% 0.17 128);
            --primary-foreground: oklch(18% 0.02 250);
            --secondary: oklch(26% 0.012 250);
            --muted: oklch(26% 0.012 250);
            --muted-foreground: oklch(68% 0.015 250);
            --border: oklch(30% 0.012 250);
            --input: oklch(32% 0.012 250);
            --ring: oklch(86% 0.17 128);
            --radius: 0.75rem;
            --font-sans: "DM Sans", sans-serif;
            --font-display: "Space Grotesk", sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--foreground);
            line-height: 1.5;
        }

        .demo {
            max-width: 64rem;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        .install {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--primary);
        }

        .demo-header h1 {
            margin: 0.75rem 0 0;
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 6vw, 3.75rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .demo-lead {
            margin: 1rem 0 0;
            max-width: 42rem;
            color: var(--muted-foreground);
        }

        .demo-lead strong { color: var(--foreground); }

        .demo-lead code {
            font-family: var(--font-mono);
            color: var(--primary);
        }

        .demo-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            margin-top: 3rem;
        }

        @media (min-width: 768px) {
            .demo-grid { grid-template-columns: 1fr 1fr; }
        }

        .demo-card {
            border: 1px solid var(--border);
            border-radius: calc(var(--radius) + 4px);
            background: var(--card);
            padding: 1.5rem;
            transition: border-color 0.15s ease;
        }

        .demo-card:hover { border-color: color-mix(in oklab, var(--primary) 50%, transparent); }

        .demo-card h2 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 500;
        }

        .demo-card .desc {
            margin: 0.25rem 0 0;
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        .demo-card .hint {
            margin: 0.75rem 0 0;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--primary);
        }

        .demo-field { margin-top: 1rem; }

        .demo-input {
            width: 100%;
            border: 1px solid var(--input);
            border-radius: var(--radius);
            background: var(--background);
            padding: 0.75rem 1rem;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 1.125rem;
            line-height: 1.75rem;
            color: var(--foreground);
        }

        .demo-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 30%, transparent);
        }

        .demo-field > div {
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
            width: 100%;
        }

        .demo-field > div > .demo-input { flex: 1; width: auto; }

        .demo-field > div > button {
            width: 3rem;
            border: 1px solid var(--input);
            border-radius: var(--radius);
            background: var(--secondary);
            color: var(--foreground);
            font-family: var(--font-mono);
            font-size: 1.125rem;
            cursor: pointer;
        }

        .demo-field > div > button:disabled { opacity: 0.3; cursor: not-allowed; }

        .demo-field.with-custom { display: flex; align-items: center; gap: 0.5rem; }
        .demo-field.with-custom .demo-controls { display: contents; }
        .demo-field.with-custom .demo-input { order: 1; flex: 1; }
        .round-btn { order: 0; }
        .round-btn-plus { order: 2; }

        .round-btn {
            width: 2.5rem;
            height: 2.5rem;
            border: 0;
            border-radius: 999px;
            background: var(--primary);
            color: var(--primary-foreground);
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
        }

        .round-btn:hover:not(:disabled) { opacity: 0.9; }
        .round-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .ref-row { display: flex; gap: 0.75rem; align-items: center; }
        .ref-row .demo-input { flex: 1; }

        .focus-btn {
            flex-shrink: 0;
            border: 0;
            border-radius: var(--radius);
            background: var(--primary);
            color: var(--primary-foreground);
            padding: 0.75rem 1rem;
            font-family: var(--font-sans);
            font-weight: 500;
            cursor: pointer;
        }

        .focus-btn:hover { opacity: 0.9; }

        .readout {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.25rem 1rem;
            margin: 1rem 0 0;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            background: var(--muted);
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .readout dt { margin: 0; color: var(--muted-foreground); }
        .readout dd { margin: 0; color: var(--primary); word-break: break-all; }

        .demo-footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        .demo-footer a { color: var(--primary); text-decoration: none; }
        .demo-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this demo.</noscript>
    <div id="root">
        <main class="demo">
            <header class="demo-header">
                <p class="install">npm i react-intl-number-input</p>
                <h1>react-intl-number-input</h1>
                <p class="demo-lead"><strong>How to type:</strong> enter digits only — the decimal separator is implied by <code>precision</code>. For <code>precision={2}</code>, typing 1250 becomes 12.50.</p>
            </header>
        </main>
    </div>
    <script src="./bundle.js"></script>
</body>
</html>
